# =============================================================================
# Composite Action — Triton Health Check
# =============================================================================
# 재사용 가능한 Health Check action
# Triton 서버가 ready 상태가 될 때까지 대기
# =============================================================================

name: Triton Health Check
description: Wait for Triton server to be ready

inputs:
  url:
    description: Triton HTTP URL
    required: true
    default: http://localhost:8000
  timeout:
    description: Maximum wait time in seconds
    required: false
    default: "120"
  container-name:
    description: Optional Docker container name to dump logs from on failure
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Wait for Triton ready
      shell: bash
      env:
        INPUT_URL: ${{ inputs.url }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_CONTAINER_NAME: ${{ inputs.container-name }}
      run: |
        URL="${INPUT_URL}"
        TIMEOUT="${INPUT_TIMEOUT}"
        CONTAINER_NAME="${INPUT_CONTAINER_NAME}"
        ELAPSED=0
        INTERVAL=5

        if [[ ! "${TIMEOUT}" =~ ^[1-9][0-9]*$ ]]; then
          echo "ERROR: timeout must be a positive integer" >&2
          exit 2
        fi

        echo "Waiting for Triton server at ${URL} (timeout: ${TIMEOUT}s)"

        while [[ ${ELAPSED} -lt ${TIMEOUT} ]]; do
          if curl -sf "${URL}/v2/health/ready" > /dev/null 2>&1; then
            echo "Triton server is ready! (${ELAPSED}s)"
            exit 0
          fi

          echo "  Not ready yet... (${ELAPSED}/${TIMEOUT}s)"
          sleep ${INTERVAL}
          ELAPSED=$((ELAPSED + INTERVAL))
        done

        echo "ERROR: Triton server did not become ready within ${TIMEOUT}s"
        if [[ -n "${CONTAINER_NAME}" ]]; then
          docker logs -- "${CONTAINER_NAME}" 2>&1 | tail -50 || true
        fi
        exit 1
