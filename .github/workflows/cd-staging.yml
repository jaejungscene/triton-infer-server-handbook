# =============================================================================
# CD Staging — Staging 자동 배포 + Integration Test
# =============================================================================
# Trigger: CI Build & Test 성공 후 자동
# =============================================================================

name: CD - Staging

on:
  workflow_run:
    workflows: ["CI - Build & Test"]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config

      - name: Update image tag
        run: |
          cd deploy/k8s/overlays/staging
          kustomize edit set image nvcr.io/nvidia/tritonserver=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to staging
        run: |
          kustomize build deploy/k8s/overlays/staging | kubectl apply -f -
          kubectl rollout status deployment/triton-server -n staging --timeout=300s

      - name: Wait for server ready
        run: |
          kubectl wait --for=condition=available deployment/triton-server -n staging --timeout=300s

      - name: Run integration tests
        run: |
          python -m pip install -r requirements-integration.txt
          kubectl port-forward -n staging svc/triton-server 8000:8000 8001:8001 8002:8002 >/tmp/triton-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill ${PF_PID}' EXIT

          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8000/v2/health/ready" > /dev/null 2>&1; then
              pytest tests/integration/ --triton-url "http://localhost:8000" -v
              exit 0
            fi
            echo "Waiting for port-forwarded Triton... (${i}/30)"
            sleep 5
          done

          cat /tmp/triton-port-forward.log
          exit 1

      - name: Notify Slack (success)
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "❌ Staging deployment FAILED\nCommit: ${{ github.sha }}\nBranch: ${{ github.ref_name }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
