# =============================================================================
# CD Staging — Staging 자동 배포 + Integration Test
# =============================================================================
# Trigger: CI Build & Test 성공 후 자동
# =============================================================================

name: CD - Staging

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["CI - Build & Test"]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          umask 077
          printf '%s' "${KUBE_CONFIG_STAGING}" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Update image tag
        run: |
          cd deploy/k8s/overlays/staging
          kustomize edit set image triton-server=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy to staging
        run: |
          kustomize build deploy/k8s/overlays/staging | kubectl apply -f -
          kubectl rollout status deployment/triton-server -n staging --timeout=300s

      - name: Wait for server ready
        run: |
          kubectl wait --for=condition=available deployment/triton-server -n staging --timeout=300s

      - name: Run integration tests
        run: |
          python -m pip install -r requirements-integration.txt
          kubectl port-forward -n staging svc/triton-server 8000:8000 8001:8001 8002:8002 >/tmp/triton-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill ${PF_PID}' EXIT

          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8000/v2/health/ready" > /dev/null 2>&1; then
              pytest tests/integration/ --triton-url "http://localhost:8000" -v
              exit 0
            fi
            echo "Waiting for port-forwarded Triton... (${i}/30)"
            sleep 5
          done

          cat /tmp/triton-port-forward.log
          exit 1

      - name: Notify Slack (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful\nCommit: ${{ github.event.workflow_run.head_sha }}\nBranch: ${{ github.event.workflow_run.head_branch }}"
            }
      - name: Notify Slack (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "text": "❌ Staging deployment FAILED\nCommit: ${{ github.event.workflow_run.head_sha }}\nBranch: ${{ github.event.workflow_run.head_branch }}"
            }
