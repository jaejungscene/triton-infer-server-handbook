# =============================================================================
# CD Staging — Staging 자동 배포 + Integration Test
# =============================================================================
# Trigger: 수동 GPU release 검증 성공 후 자동
# =============================================================================

name: CD - Staging

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["CI - GPU Release"]
    types: [completed]
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      KUBE_CONTEXT_STAGING: ${{ vars.KUBE_CONTEXT_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image digest
        run: |
          DIGEST="$(docker buildx imagetools inspect "${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve an immutable digest for ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "IMAGE_REF=${REGISTRY}/${IMAGE_NAME}@${DIGEST}" >> "${GITHUB_ENV}"
        env:
          RELEASE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          umask 077
          printf '%s' "${KUBE_CONFIG_STAGING}" | base64 -d > ~/.kube/config
          if [[ -z "${KUBE_CONTEXT_STAGING}" ]]; then
            echo "KUBE_CONTEXT_STAGING environment variable is required" >&2
            exit 1
          fi
          kubectl config use-context "${KUBE_CONTEXT_STAGING}"
          test "$(kubectl config current-context)" = "${KUBE_CONTEXT_STAGING}"
        env:
          KUBE_CONFIG_STAGING: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Capture current staging image
        id: previous
        run: |
          if kubectl get deployment/triton-server -n staging > /dev/null 2>&1; then
            PREVIOUS_IMAGE="$(kubectl get deployment/triton-server -n staging \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="triton")].image}')"
            if [[ -z "${PREVIOUS_IMAGE}" ]]; then
              echo "Existing deployment does not contain the triton container" >&2
              exit 1
            fi
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "image=${PREVIOUS_IMAGE}" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Update image tag
        run: |
          cd deploy/k8s/overlays/staging
          kustomize edit set image "triton-server=${IMAGE_REF}"

      - name: Deploy to staging
        id: deploy
        run: |
          echo "applied=true" >> "${GITHUB_OUTPUT}"
          kustomize build deploy/k8s/overlays/staging | kubectl apply -f -
          kubectl rollout status deployment/triton-server -n staging --timeout=300s

      - name: Wait for server ready
        run: |
          kubectl wait --for=condition=available deployment/triton-server -n staging --timeout=300s

      - name: Run integration tests
        run: |
          python -m pip install -r requirements-integration.txt
          kubectl port-forward -n staging svc/triton-server 8000:8000 8001:8001 8002:8002 >/tmp/triton-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill ${PF_PID}' EXIT

          for i in $(seq 1 30); do
            if curl -sf "http://localhost:8000/v2/health/ready" > /dev/null 2>&1; then
              pytest tests/integration/ --run-live --triton-url "http://localhost:8000" -v
              exit 0
            fi
            echo "Waiting for port-forwarded Triton... (${i}/30)"
            sleep 5
          done

          cat /tmp/triton-port-forward.log
          exit 1

      - name: Restore previous staging image
        if: >-
          ${{ failure() && steps.deploy.outputs.applied == 'true' &&
              steps.previous.outputs.exists == 'true' }}
        run: |
          kubectl set image deployment/triton-server -n staging \
            "triton=${PREVIOUS_IMAGE}"
          kubectl rollout status deployment/triton-server -n staging --timeout=300s
          RESTORED_IMAGE="$(kubectl get deployment/triton-server -n staging \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="triton")].image}')"
          test "${RESTORED_IMAGE}" = "${PREVIOUS_IMAGE}"
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}

      - name: Report unavailable first-deploy rollback
        if: >-
          ${{ failure() && steps.deploy.outputs.applied == 'true' &&
              steps.previous.outputs.exists != 'true' }}
        run: |
          echo "Staging verification failed and no previous deployment exists to restore." >&2

      - name: Notify Slack (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "text": "✅ Staging deployment successful\nCommit: ${{ github.event.workflow_run.head_sha }}\nBranch: ${{ github.event.workflow_run.head_branch }}"
            }
      - name: Notify Slack (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 # v1.25.0
        with:
          payload: |
            {
              "text": "❌ Staging deployment FAILED\nCommit: ${{ github.event.workflow_run.head_sha }}\nBranch: ${{ github.event.workflow_run.head_branch }}"
            }
