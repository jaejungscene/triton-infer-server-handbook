# =============================================================================
# CI Build Candidate — 모델 빌드 + Candidate Image Push
# =============================================================================
# Trigger: main branch에 merge 시
# Runner: GitHub-hosted runner (GPU 불필요)
# 주의: 이 workflow는 release SHA tag를 만들지 않습니다.
# =============================================================================

name: CI - Build Candidate

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'configs/**'
      - 'scripts/**'
      - 'client/**'
      - 'tests/**'
      - 'deploy/docker/**'
      - '.github/**'
      - 'requirements*.txt'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-candidate:
    name: Build Candidate Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ci-build-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # ── Step 1: Build model_repository ──
      - name: Build production model repository
        run: |
          ./scripts/build.sh --env prod --clean
          echo "Model repository contents:"
          ls -la model_repository/

      - name: Reclaim disk for Triton image build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h /

      # ── Step 2: Docker image build ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Record candidate identity
        run: |
          if [[ ! "${CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Candidate build did not return an immutable digest" >&2
            exit 1
          fi
          {
            echo "### Candidate image"
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Image: \`${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}\`"
            echo "- Status: GPU 검증 전 candidate이며 release 또는 배포에 사용할 수 없음"
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
