# =============================================================================
# CI Build & Test — 모델 빌드 + Smoke Test + Image Push
# =============================================================================
# Trigger: main branch에 merge 시
# Runner: self-hosted GPU runner (GPU 필요)
# =============================================================================

name: CI - Build & Test

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'configs/**'
      - 'scripts/**'
      - 'client/**'
      - 'tests/**'
      - 'deploy/docker/**'
      - '.github/**'
      - 'requirements*.txt'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Smoke Test
    runs-on: [self-hosted, gpu]  # GPU self-hosted runner
    timeout-minutes: 60
    concurrency:
      group: ci-build-test-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # ── Step 1: Build model_repository ──
      - name: Build model repository
        run: |
          ./scripts/build.sh --env dev --clean
          echo "Model repository contents:"
          ls -la model_repository/

      # ── Step 2: Docker image build ──
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish candidate image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Step 3: Start Triton + Smoke Test ──
      - name: Start Triton server
        run: |
          docker run -d \
            --name triton-test \
            --gpus all \
            -p 8000:8000 -p 8001:8001 -p 8002:8002 \
            "${RELEASE_IMAGE}" \
            --model-repository=/models \
            --model-control-mode=poll \
            --strict-model-config=true \
            --cache-config=local,size=16777216 \
            --log-verbose=1
        env:
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Wait for server ready
        uses: ./.github/actions/triton-health-check
        with:
          url: http://localhost:8000
          timeout: 120
          container-name: triton-test

      - name: Run smoke tests
        run: |
          python -m pip install -r requirements-integration.txt
          pytest tests/smoke/ --run-live --triton-url http://localhost:8000 -v

      - name: Promote tested digest to release tag
        run: |
          docker buildx imagetools create \
            --tag "${RELEASE_TAG}" \
            "${CANDIDATE_IMAGE}"
          PROMOTED_DIGEST="$(docker buildx imagetools inspect \
            "${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          test "${PROMOTED_DIGEST}" = "${CANDIDATE_DIGEST}"
        env:
          CANDIDATE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          CANDIDATE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Cleanup test container
        if: always()
        run: |
          docker stop triton-test 2>/dev/null || true
          docker rm triton-test 2>/dev/null || true
