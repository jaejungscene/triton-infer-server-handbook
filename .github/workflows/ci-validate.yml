# =============================================================================
# CI Validate — PR 시 config 검증 + lint + manifest 정합성
# =============================================================================
# Trigger: PR → main, develop
# Runner: ubuntu-latest (GPU 불필요)
# =============================================================================

name: CI - Validate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'models/**'
      - 'configs/**'
      - 'scripts/**'
      - 'client/**'
      - 'tests/**'
      - 'deploy/**'
      - 'monitoring/**'
      - '.github/**'
      - 'requirements*.txt'

jobs:
  validate-configs:
    name: Validate Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate config.pbtxt files
        run: ./scripts/validate.sh

      - name: Validate manifest.yaml
        run: pytest tests/config/ -v

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install -r requirements-dev.txt

      - name: Lint model.py files
        run: |
          ruff check models/ client/ tests/ --select E,W,F --ignore E501

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline unit tests
        run: pytest tests/client/ tests/scripts/ tests/perf/ -v

  lint-docker:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile
          failure-threshold: warning

      - name: Run hadolint (converter)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: deploy/docker/Dockerfile.converter
          failure-threshold: warning

  validate-deployments:
    name: Validate Deployment Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Validate overlays
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "Validating: ${overlay}"
            kustomize build "${overlay}" > /dev/null
          done

      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/triton
          helm lint deploy/helm/triton -f deploy/helm/triton/values.dev.yaml
          helm template triton deploy/helm/triton \
            -f deploy/helm/triton/values.dev.yaml > /dev/null
          helm lint deploy/helm/triton -f deploy/helm/triton/values.staging.yaml
          helm template triton deploy/helm/triton \
            -f deploy/helm/triton/values.staging.yaml > /dev/null
          RELEASE_DIGEST="sha256:$(printf '0%.0s' {1..64})"
          helm lint deploy/helm/triton \
            -f deploy/helm/triton/values.prod.yaml \
            --set "image.digest=${RELEASE_DIGEST}"
          helm template triton deploy/helm/triton \
            -f deploy/helm/triton/values.prod.yaml \
            --set "image.digest=${RELEASE_DIGEST}" > /dev/null

      - name: Validate Docker Compose
        run: |
          docker compose -f deploy/docker/docker-compose.yml config --quiet
          TRITON_IMAGE=triton-server:ci-validation GRAFANA_ADMIN_PASSWORD=ci-validation \
            docker compose -f deploy/docker/docker-compose.prod.yml config --quiet

      - name: Validate Prometheus config and rules
        run: |
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.0 \
            check config /etc/prometheus/scrape_config.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.0 \
            check rules /etc/prometheus/triton_rules.yml
          docker run --rm --entrypoint /bin/promtool \
            -v "${PWD}/monitoring/prometheus:/etc/prometheus:ro" \
            -w /etc/prometheus \
            prom/prometheus:v3.13.0 \
            test rules triton_rules_test.yml

      - name: Validate shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "${script}"
          done < <(find scripts tests -type f -name '*.sh' -print0)
