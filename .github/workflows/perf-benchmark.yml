# =============================================================================
# Performance Benchmark — 성능 기준선 비교
# =============================================================================
# Trigger: GPU runner가 준비된 시점에 수동
# Runner: self-hosted GPU runner
# =============================================================================

name: Performance Benchmark

permissions:
  contents: read

concurrency:
  group: performance-benchmark
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Specific model to benchmark (empty = all)'
        required: false
        default: ''

jobs:
  benchmark:
    name: Run Performance Benchmark
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-integration.txt

      - name: Build model repository
        run: ./scripts/build.sh --env prod --clean

      - name: Build release-equivalent image
        run: |
          docker build \
            --file deploy/docker/Dockerfile \
            --build-arg "VCS_REF=${GITHUB_SHA}" \
            --tag triton-server:perf \
            .

      - name: Start Triton server
        run: |
          docker rm -f triton-perf 2>/dev/null || true
          docker run -d \
            --name triton-perf \
            --gpus all \
            -p 8000:8000 -p 8001:8001 -p 8002:8002 \
            triton-server:perf \
              --model-repository=/models \
              --model-control-mode=explicit \
              --load-model=* \
              --strict-model-config=true \
              --cache-config=local,size=67108864 \
              --log-verbose=0

      - name: Wait for server ready
        uses: ./.github/actions/triton-health-check
        with:
          url: http://localhost:8000
          timeout: 180
          container-name: triton-perf

      - name: Run perf_analyzer
        run: |
          MODEL_ARGS=()
          if [[ -n "${BENCHMARK_MODEL}" ]]; then
            MODEL_ARGS=(--model "${BENCHMARK_MODEL}")
          fi
          docker run --rm \
            --network host \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            nvcr.io/nvidia/tritonserver:24.08-py3-sdk@sha256:af34153227000b64d1ed4faf9612570a44d414ab8aa0e1dc143f18c19d71a5a7 \
            ./tests/perf/run_perf_analyzer.sh "${MODEL_ARGS[@]}"
        env:
          BENCHMARK_MODEL: ${{ github.event.inputs.model }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-results-${{ github.sha }}
          path: tests/perf/results/
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup
        if: always()
        run: |
          docker stop triton-perf 2>/dev/null || true
          docker rm triton-perf 2>/dev/null || true
          docker image rm triton-server:perf 2>/dev/null || true
