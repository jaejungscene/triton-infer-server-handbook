# =============================================================================
# Performance Benchmark — 성능 기준선 비교
# =============================================================================
# Trigger: 주간 스케줄 + 수동
# Runner: self-hosted GPU runner
# =============================================================================

name: Performance Benchmark

permissions:
  contents: read

concurrency:
  group: performance-benchmark
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 3 * * 1'  # 매주 월요일 03:00 UTC
  workflow_dispatch:
    inputs:
      model:
        description: 'Specific model to benchmark (empty = all)'
        required: false
        default: ''

jobs:
  benchmark:
    name: Run Performance Benchmark
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements-integration.txt

      - name: Build model repository
        run: ./scripts/build.sh --env dev --clean

      - name: Start Triton server
        run: |
          docker rm -f triton-perf 2>/dev/null || true
          docker run -d \
            --name triton-perf \
            --gpus all \
            -p 8000:8000 -p 8001:8001 -p 8002:8002 \
            -v $(pwd)/model_repository:/models:ro \
            nvcr.io/nvidia/tritonserver:24.08-py3 \
            tritonserver \
              --model-repository=/models \
              --model-control-mode=poll \
              --strict-model-config=true \
              --log-verbose=0

      - name: Wait for server ready
        uses: ./.github/actions/triton-health-check
        with:
          url: http://localhost:8000
          timeout: 180
          container-name: triton-perf

      - name: Run perf_analyzer
        run: |
          MODEL_ARGS=()
          if [[ -n "${BENCHMARK_MODEL}" ]]; then
            MODEL_ARGS=(--model "${BENCHMARK_MODEL}")
          fi
          docker run --rm \
            --network host \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            nvcr.io/nvidia/tritonserver:24.08-py3-sdk \
            ./tests/perf/run_perf_analyzer.sh "${MODEL_ARGS[@]}"
        env:
          BENCHMARK_MODEL: ${{ github.event.inputs.model }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.sha }}
          path: tests/perf/results/
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup
        if: always()
        run: |
          docker stop triton-perf 2>/dev/null || true
          docker rm triton-perf 2>/dev/null || true
