# =============================================================================
# Docker Compose — Production 환경 (Cache + Monitoring)
# =============================================================================
# 사용법:
#   cp .env.example .env.prod  # release image, 비밀번호와 포트 확인
#   docker compose --env-file .env.prod -f deploy/docker/docker-compose.prod.yml up -d
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  triton:
    image: ${TRITON_IMAGE:?set TRITON_IMAGE to the validated release image}
    pull_policy: always
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${TRITON_HTTP_PORT:-8000}:8000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${TRITON_GRPC_PORT:-8001}:8001"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${TRITON_METRICS_PORT:-8002}:8002"
    command:
      - --model-repository=/models
      - --model-control-mode=explicit
      - --load-model=*
      - --strict-model-config=true
      - --log-verbose=0
      - --allow-metrics=true
      - --allow-gpu-metrics=true
      - --cache-config=local,size=${CACHE_SIZE:-67108864}
      - --rate-limit=execution_count
      - --http-thread-count=8
      - --grpc-infer-thread-count=8
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    # 이 profile은 Redis dependency만 시작합니다. Triton은 검증된 Redis cache
    # plugin을 release image에 포함하고 command를 바꾸기 전까지 local cache를 사용합니다.
    image: redis:8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763
    profiles: ["redis-cache"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../../monitoring/prometheus/scrape_config.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/triton_rules.yml:/etc/prometheus/triton_rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      triton:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.0.3@sha256:1a345428a36270f5fb9add69fea71450a5843c15266c99359d6d380470ab19c9
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../../monitoring/grafana/triton_dashboard.json:/var/lib/grafana/dashboards/triton.json:ro
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in the env file}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
