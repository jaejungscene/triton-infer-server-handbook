# =============================================================================
# Docker Compose — 로컬/개발 환경
# =============================================================================
# 사용법:
#   docker compose --env-file .env.dev -f deploy/docker/docker-compose.yml up -d
#   docker compose --env-file .env.dev -f deploy/docker/docker-compose.yml logs -f triton
# =============================================================================

services:
  triton:
    image: ${TRITON_DEV_IMAGE:-nvcr.io/nvidia/tritonserver:24.08-py3@sha256:0b6a7449ea6a46fd167376d40418b169ed82cd36addc6f6c56fe2cbda4294e13}
    container_name: triton-server
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${TRITON_HTTP_PORT:-8000}:8000"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${TRITON_GRPC_PORT:-8001}:8001"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${TRITON_METRICS_PORT:-8002}:8002"
    volumes:
      - "${MODEL_REPOSITORY_PATH:-../../model_repository}:/models:ro"
    command: >
      tritonserver
        --model-repository=/models
        --model-control-mode=poll
        --repository-poll-secs=5
        --log-verbose=2
        --strict-model-config=true
        --allow-metrics=true
        --allow-gpu-metrics=true
        --cache-config=local,size=${CACHE_SIZE:-16777216}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
