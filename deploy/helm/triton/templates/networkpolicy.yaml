{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "triton.fullname" . }}
  labels:
    {{- include "triton.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "triton.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.allowSameNamespace }}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: {{ .Values.service.httpPort }}}
        - {protocol: TCP, port: {{ .Values.service.grpcPort }}}
        - {protocol: TCP, port: {{ .Values.service.metricsPort }}}
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.httpPort }}}
        - {protocol: TCP, port: {{ .Values.service.grpcPort }}}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.monitoringNamespaceSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.service.metricsPort }}}
{{- end }}
