# ============================================================
# Triton Inference Server — Helm Chart 기본값
# 환경별 오버라이드: values.dev.yaml / values.staging.yaml / values.prod.yaml
# ============================================================

image:
  repository: triton-server
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []
priorityClassName: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8002"
  prometheus.io/path: /metrics
podLabels: {}

replicaCount: 1

minReadySeconds: 10
progressDeadlineSeconds: 900
terminationGracePeriodSeconds: 60
automountServiceAccountToken: false

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

lifecycle:
  preStop:
    exec:
      command: ["/bin/sh", "-c", "sleep 10"]

# ----- Triton 서버 인수 -----
tritonArgs:
  - --model-repository=/models
  - --strict-model-config=true
  - --allow-metrics=true
  - --allow-gpu-metrics=true
  - --cache-config=local,size=33554432
  - --log-verbose=0

# ----- 서비스 -----
service:
  type: ClusterIP
  httpPort: 8000
  grpcPort: 8001
  metricsPort: 8002

# ----- 네트워크 접근 제어 -----
networkPolicy:
  enabled: false
  allowSameNamespace: true
  ingressNamespaceSelector:
    kubernetes.io/metadata.name: ingress-nginx
  monitoringNamespaceSelector:
    kubernetes.io/metadata.name: monitoring

# ----- 리소스 -----
resources:
  requests:
    cpu: "2"
    memory: "8Gi"
    nvidia.com/gpu: "1"
  limits:
    cpu: "4"
    memory: "16Gi"
    nvidia.com/gpu: "1"

# ----- 외부 모델 저장소 PVC (기본은 image에 포함된 /models 사용) -----
persistence:
  enabled: false
  existingClaim: ""
  mountPath: /models
  size: 50Gi
  accessMode: ReadWriteMany
  annotations: {}
  # storageClassName: ""   # 클러스터 환경에 맞게 설정

# ----- HPA (수평 파드 자동 확장) -----
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

# ----- PodDisruptionBudget -----
pdb:
  enabled: false
  minAvailable: 1

# ----- 노드 선택 (GPU 노드 고정) -----
nodeSelector:
  accelerator: nvidia-gpu

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}
topologySpread:
  enabled: false
  maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: ScheduleAnyway

# Secret/ConfigMap 기반 cloud repository 인증 등에 사용
env: []
envFrom: []
extraVolumeMounts: []
extraVolumes: []

# ----- 프로브 -----
livenessProbe:
  httpGet:
    path: /v2/health/live
    port: 8000
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v2/health/ready
    port: 8000
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /v2/health/live
    port: 8000
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
