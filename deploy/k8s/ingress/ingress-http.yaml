apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: triton-http
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: triton.example.com
      http:
        paths:
          # 외부에는 추론 surface만 공개한다. repository/trace/shared-memory
          # 제어 API는 cluster-internal operator endpoint로 분리한다.
          - path: /v2
            pathType: Exact
            backend:
              service:
                name: triton-server
                port:
                  name: http
          - path: /v2/health
            pathType: Prefix
            backend:
              service:
                name: triton-server
                port:
                  name: http
          - path: /v2/models
            pathType: Prefix
            backend:
              service:
                name: triton-server
                port:
                  name: http
