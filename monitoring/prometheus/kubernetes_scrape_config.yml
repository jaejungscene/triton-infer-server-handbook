# Prometheus scrape configuration for Helm and Kustomize Triton Pods.
# Prometheus needs Kubernetes pod discovery RBAC for every watched namespace.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "triton_rules.yml"

scrape_configs:
  - job_name: "triton-inference-server-kubernetes"
    kubernetes_sd_configs:
      - role: pod

    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"

      # Kustomize base uses app=triton-server; Helm uses
      # app.kubernetes.io/name=triton.
      - source_labels:
          - __meta_kubernetes_pod_label_app
          - __meta_kubernetes_pod_label_app_kubernetes_io_name
        separator: ";"
        action: keep
        regex: "triton-server;|;triton"

      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: "(.+)"

      # Build an IPv4 or IPv6 target from Pod IP plus the annotated metrics port.
      - source_labels:
          - __meta_kubernetes_pod_ip
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        separator: ";"
        action: replace
        target_label: __address__
        regex: "([^:]+);([0-9]+)"
        replacement: "$1:$2"

      - source_labels:
          - __meta_kubernetes_pod_ip
          - __meta_kubernetes_pod_annotation_prometheus_io_port
        separator: ";"
        action: replace
        target_label: __address__
        regex: "(.+:.*);([0-9]+)"
        replacement: "[$1]:$2"

      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: environment

      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

      - target_label: service
        replacement: triton
