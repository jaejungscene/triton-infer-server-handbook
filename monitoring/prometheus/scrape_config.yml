# Prometheus scrape configuration for the single-host Compose topology.
# Kubernetes uses kubernetes_scrape_config.yml instead.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "triton_rules.yml"

scrape_configs:
  - job_name: "triton-inference-server"
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]
        labels:
          service: triton
          environment: production
