# Triton Inference Server — Prometheus Alert Rules

groups:
  - name: triton_alerts
    rules:
      # 높은 평균 추론 지연 — 5분 평균 latency > 200ms
      - alert: TritonHighLatency
        expr: |
          (
            sum by (environment, model, version) (rate(nv_inference_request_duration_us[5m]))
            /
            sum by (environment, model, version) (rate(nv_inference_request_success[5m]))
          ) > 200000
          and on (environment, model, version)
          sum by (environment, model, version) (rate(nv_inference_request_success[5m])) >= 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High inference latency on {{ $labels.environment }}/{{ $labels.model }}"
          description: "environment={{ $labels.environment }}, model={{ $labels.model }}, version={{ $labels.version }}: 5m average latency is {{ $value }}us (threshold: 200ms)"
          runbook_url: "https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md"

      # 추론 요청 에러율 > 5%
      - alert: TritonHighErrorRate
        expr: |
          (
            sum by (environment, model, version) (rate(nv_inference_request_failure[5m]))
            /
            sum by (environment, model, version) (
              rate(nv_inference_request_success[5m])
              + rate(nv_inference_request_failure[5m])
            )
          ) > 0.05
          and on (environment, model, version)
          sum by (environment, model, version) (
            rate(nv_inference_request_success[5m])
            + rate(nv_inference_request_failure[5m])
          ) >= 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.environment }}/{{ $labels.model }}"
          description: "environment={{ $labels.environment }}, model={{ $labels.model }}, version={{ $labels.version }}: error rate is {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md"

      # 큐 대기 시간이 길어짐
      - alert: TritonQueueBacklog
        expr: |
          (
            sum by (environment, model, version) (rate(nv_inference_queue_duration_us[5m]))
            /
            sum by (environment, model, version) (rate(nv_inference_request_success[5m]))
          ) > 100000
          and on (environment, model, version)
          sum by (environment, model, version) (rate(nv_inference_request_success[5m])) >= 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Queue backlog on {{ $labels.environment }}/{{ $labels.model }}"
          description: "environment={{ $labels.environment }}, model={{ $labels.model }}, version={{ $labels.version }}: queue wait time is {{ $value }}us"
          runbook_url: "https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md"

      # GPU 사용률 높음 (> 90%)
      - alert: TritonGPUHighUtilization
        expr: nv_gpu_utilization > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High GPU utilization on {{ $labels.environment }}/{{ $labels.instance }}"
          description: "GPU {{ $labels.gpu_uuid }} utilization is {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md"

      # GPU 메모리 사용률 높음 (> 90%)
      - alert: TritonGPUMemoryHigh
        expr: nv_gpu_memory_used_bytes / nv_gpu_memory_total_bytes > 0.9
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "High GPU memory usage on {{ $labels.environment }}/{{ $labels.instance }}"
          description: "GPU {{ $labels.gpu_uuid }} memory usage is {{ $value | humanizePercentage }}"
          runbook_url: "https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md"

      # Triton 서버 다운
      - alert: TritonServerDown
        expr: up{service="triton"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Triton server is down on {{ $labels.environment }}/{{ $labels.instance }}"
          description: "Triton inference server {{ $labels.instance }} is unreachable"
          runbook_url: "https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md"

      # service discovery 실패 등으로 target 시계열 자체가 사라짐
      - alert: TritonMetricsMissing
        expr: absent_over_time(up{service="triton",environment="production"}[5m])
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Triton metrics target is missing on {{ $labels.environment }}"
          description: "No production Triton scrape target has been discovered for at least 5 minutes"
          runbook_url: "https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md"
