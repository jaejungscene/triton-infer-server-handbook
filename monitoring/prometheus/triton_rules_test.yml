rule_files:
  - triton_rules.yml

evaluation_interval: 1m

tests:
  - name: sustained production errors trigger an alert
    interval: 1m
    input_series:
      - series: 'nv_inference_request_success{environment="production",model="classifier",version="1"}'
        values: '0+60x15'
      - series: 'nv_inference_request_failure{environment="production",model="classifier",version="1"}'
        values: '0+6x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: TritonHighErrorRate
        exp_alerts:
          - exp_labels:
              environment: production
              model: classifier
              version: "1"
              severity: critical
            exp_annotations:
              summary: High error rate on production/classifier
              description: 'environment=production, model=classifier, version=1: error rate is 9.091%'
              runbook_url: https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md

  - name: sparse errors do not page
    interval: 1m
    input_series:
      - series: 'nv_inference_request_success{environment="production",model="batch",version="1"}'
        values: '0+1x15'
      - series: 'nv_inference_request_failure{environment="production",model="batch",version="1"}'
        values: '0+1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: TritonHighErrorRate
        exp_alerts: []

  - name: sustained latency and queue time trigger warnings
    interval: 1m
    input_series:
      - series: 'nv_inference_request_success{environment="production",model="classifier",version="1"}'
        values: '0+60x20'
      - series: 'nv_inference_request_duration_us{environment="production",model="classifier",version="1"}'
        values: '0+18000000x20'
      - series: 'nv_inference_queue_duration_us{environment="production",model="classifier",version="1"}'
        values: '0+7200000x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: TritonHighLatency
        exp_alerts:
          - exp_labels:
              environment: production
              model: classifier
              version: "1"
              severity: warning
            exp_annotations:
              summary: High inference latency on production/classifier
              description: 'environment=production, model=classifier, version=1: 5m average latency is 300000us (threshold: 200ms)'
              runbook_url: https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md
      - eval_time: 17m
        alertname: TritonQueueBacklog
        exp_alerts:
          - exp_labels:
              environment: production
              model: classifier
              version: "1"
              severity: warning
            exp_annotations:
              summary: Queue backlog on production/classifier
              description: 'environment=production, model=classifier, version=1: queue wait time is 120000us'
              runbook_url: https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md

  - name: sustained GPU saturation identifies the affected device
    interval: 1m
    input_series:
      - series: 'nv_gpu_utilization{environment="production",instance="triton:8002",gpu_uuid="GPU-0"}'
        values: '0.95x20'
      - series: 'nv_gpu_memory_used_bytes{environment="production",instance="triton:8002",gpu_uuid="GPU-0"}'
        values: '95x20'
      - series: 'nv_gpu_memory_total_bytes{environment="production",instance="triton:8002",gpu_uuid="GPU-0"}'
        values: '100x20'
    alert_rule_test:
      - eval_time: 17m
        alertname: TritonGPUHighUtilization
        exp_alerts:
          - exp_labels:
              environment: production
              instance: triton:8002
              gpu_uuid: GPU-0
              severity: warning
            exp_annotations:
              summary: High GPU utilization on production/triton:8002
              description: GPU GPU-0 utilization is 95%
              runbook_url: https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md
      - eval_time: 12m
        alertname: TritonGPUMemoryHigh
        exp_alerts:
          - exp_labels:
              environment: production
              instance: triton:8002
              gpu_uuid: GPU-0
              severity: critical
            exp_annotations:
              summary: High GPU memory usage on production/triton:8002
              description: GPU GPU-0 memory usage is 95%
              runbook_url: https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md

  - name: unreachable target triggers server down
    interval: 1m
    input_series:
      - series: 'up{environment="production",instance="triton:8002",job="custom-monitor",service="triton"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 3m
        alertname: TritonServerDown
        exp_alerts:
          - exp_labels:
              environment: production
              instance: triton:8002
              job: custom-monitor
              service: triton
              severity: critical
            exp_annotations:
              summary: Triton server is down on production/triton:8002
              description: Triton inference server triton:8002 is unreachable
              runbook_url: https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md

  - name: staging target does not mask missing production target
    interval: 1m
    input_series:
      - series: 'up{environment="staging",instance="triton-staging:8002",service="triton"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: TritonMetricsMissing
        exp_alerts:
          - exp_labels:
              environment: production
              service: triton
              severity: critical
            exp_annotations:
              summary: Triton metrics target is missing on production
              description: No production Triton scrape target has been discovered for at least 5 minutes
              runbook_url: https://github.com/jaejungscene/triton-infer-server-handbook/blob/main/docs/runbook.md

  - name: discovered production target suppresses missing alert
    interval: 1m
    input_series:
      - series: 'up{environment="production",instance="triton:8002",service="triton"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: TritonMetricsMissing
        exp_alerts: []
